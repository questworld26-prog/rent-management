[project]
name = "rent-management-dashboard"
version = "1.3.0"
description = "Private, local-first rental property management dashboard with spec-driven verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.2.0",
    "httpx>=0.27.0",
    "nicegui>=3.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src", "tools"]


[tool.pytest.ini_options]
testpaths = ["tests", "tools/tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "N",     # pep8-naming (function, class, variable naming conventions)
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "C901",  # mccabe complexity
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # function calls in argument defaults
]

[tool.ruff.lint.mccabe]
max-complexity = 15



[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


